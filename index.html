    <style>
        :root {
            --primary: #2563eb;

            backdrop-filter: blur(12px);

            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        .bento-card {
            transition: all 0.5s cubic-bezier(0.23, 1, 0.32, 1);
